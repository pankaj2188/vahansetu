<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VahanSetu - Alert Vehicle Owner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        // We will initialize your free EmailJS account here later
        (function() {
            emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
        })();
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 relative overflow-hidden">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tighter">VahanSetu</h1>
            <p class="text-gray-500 text-sm font-bold text-emerald-600 mt-1">100% Anonymous Alert</p>
        </div>

        <div id="loading-state" class="text-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
            <p class="text-gray-600 font-medium">Fetching vehicle details...</p>
        </div>

        <div id="error-state" class="hidden text-center py-10">
            <svg class="h-16 w-16 text-red-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Invalid QR Code</h2>
            <p class="text-gray-500">This vehicle tag is not registered in our system.</p>
        </div>

        <div id="action-state" class="hidden">
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center mb-6">
                <p class="text-xs text-indigo-500 font-bold uppercase tracking-wider mb-1">Vehicle Found</p>
                <h2 id="display-vehicle-num" class="text-3xl font-black text-gray-900 tracking-widest">BR-XX-XXXX</h2>
            </div>

            <form id="alert-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">What is the issue?</label>
                    <select id="issue-type" class="w-full border border-gray-300 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-gray-800 font-medium cursor-pointer shadow-sm">
                        <option value="Blocking my vehicle">Blocking my vehicle (मेरा वाहन रोक दिया है)</option>
                        <option value="Parked in wrong spot">Parked in wrong spot (गलत जगह पार्क है)</option>
                        <option value="Headlights left on">Headlights left on (हेडलाइट चालू है)</option>
                        <option value="Window left open">Window left open (खिड़की खुली है)</option>
                        <option value="Vehicle is damaged">Vehicle is damaged (वाहन क्षतिग्रस्त है)</option>
                        <option value="Urgent: Please move">Urgent: Please move (कृपया तुरंत हटाएं)</option>
                    </select>
                </div>

                <button type="submit" id="send-alert-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-4 rounded-xl transition duration-200 shadow-lg shadow-red-500/30 flex justify-center items-center gap-2 mt-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                    Send Anonymous Alert
                </button>
            </form>
        </div>

        <div id="success-state" class="hidden text-center py-8">
            <div class="bg-green-100 rounded-full p-3 inline-block mb-4">
                <svg class="h-12 w-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Alert Sent Securely!</h2>
            <p class="text-gray-600">The owner has been notified via Dashboard, Email, and Telegram.</p>
            <p class="text-sm font-bold text-indigo-600 mt-8">Powered by VahanSetu</p>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxxam2BQmpD3yQ79sI0-WS0dEuPXhldOo",
            authDomain: "vahansetu-d9ea9.firebaseapp.com",
            projectId: "vahansetu-d9ea9",
            storageBucket: "vahansetu-d9ea9.firebasestorage.app",
            messagingSenderId: "899743582502",
            appId: "1:899743582502:web:8de33754f6f216747899e7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const actionState = document.getElementById('action-state');
        const successState = document.getElementById('success-state');
        const displayVehicleNum = document.getElementById('display-vehicle-num');
        const alertForm = document.getElementById('alert-form');
        const sendAlertBtn = document.getElementById('send-alert-btn');

        // Dynamic Owner Data
        let vehicleOwnerUid = "";
        let vehicleOwnerEmail = "";
        let vehicleOwnerTelegramId = "";

        function getTagIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        async function loadVehicleData() {
            const tagId = getTagIdFromUrl();
            if (!tagId) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                return;
            }

            try {
                const docRef = doc(db, "vehicles", tagId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    displayVehicleNum.textContent = data.vehicleNumber;
                    
                    // Fetch dynamic details for the triple alert
                    vehicleOwnerUid = data.ownerUid; 
                    vehicleOwnerEmail = data.ownerEmail || ""; 
                    vehicleOwnerTelegramId = data.telegramChatId || "5741094554"; // Fallback to your ID for testing
                    
                    loadingState.classList.add('hidden');
                    actionState.classList.remove('hidden');
                } else {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error fetching document:", error);
                alert("Network error. Please try again.");
            }
        }

        alertForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const issueType = document.getElementById('issue-type').value;
            const tagId = getTagIdFromUrl();

            sendAlertBtn.innerHTML = "Sending Alerts...";
            sendAlertBtn.disabled = true;
            sendAlertBtn.classList.add('opacity-70');

            try {
                // --- TRIGGER 1: THE DASHBOARD ALERT (Firebase) ---
                await addDoc(collection(db, "alerts"), {
                    vehicleId: tagId,
                    vehicleNumber: displayVehicleNum.textContent,
                    ownerUid: vehicleOwnerUid,
                    issue: issueType,
                    status: "unread",
                    createdAt: serverTimestamp()
                });

                // --- TRIGGER 2: THE TELEGRAM ALERT ---
                if (vehicleOwnerTelegramId) {
                    const telegramToken = "8680989133:AAEw0KvyBB7_bw6jmUGVtuPZIQf4h2zURo4";
                    const telegramMessage = `🚨 *VahanSetu Alert!*\n\n🚘 *Vehicle:* ${displayVehicleNum.textContent}\n⚠️ *Issue:* ${issueType}\n\n📍 Someone is waiting. Please check your vehicle immediately.`;
                    const telegramUrl = `https://api.telegram.org/bot${telegramToken}/sendMessage?chat_id=${vehicleOwnerTelegramId}&text=${encodeURIComponent(telegramMessage)}&parse_mode=Markdown`;
                    
                    // Send without waiting for the response to keep UI fast
                    fetch(telegramUrl).catch(err => console.error("Telegram Error:", err));
                }

                // --- TRIGGER 3: THE EMAIL ALERT (EmailJS) ---
                if (vehicleOwnerEmail && typeof emailjs !== 'undefined') {
                    // This will fire once you create your free EmailJS account
                    emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                        to_email: vehicleOwnerEmail,
                        vehicle_number: displayVehicleNum.textContent,
                        issue: issueType,
                        reply_to: "no-reply@vahansetu.hinditribune.in"
                    }).catch(err => console.error("EmailJS Error:", err));
                }

                // Show Success Screen
                actionState.classList.add('hidden');
                successState.classList.remove('hidden');

            } catch (error) {
                console.error("Error sending alert: ", error);
                alert("Failed to send alert. Please try again.");
                sendAlertBtn.innerHTML = "Send Anonymous Alert";
                sendAlertBtn.disabled = false;
                sendAlertBtn.classList.remove('opacity-70');
            }
        });

        window.onload = loadVehicleData;
    </script>
</body>
</html>
